[project]
name = "hmgrisen-bot"
version = "0.1.0"
description = "A multi-purpose Discord bot for the Discord server of The Norwegian Student Society"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.*",
    "asyncpg==0.32.*",
    "discord.py==2.7.*",
    "psutil==7.2.*",
    "pydantic==2.14.*",
    "pypandoc==1.17.*",
    "python-dotenv==1.2.*",
    "regex==2026.9.29",
    "tzdata",  # This only needed if run on windows. I haven't set a version either to ensure it's up to date.
]
