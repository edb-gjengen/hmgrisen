[project]
name = "hmgrisen"
version = "0.1.0"
description = "A multi-purpose Discord bot for the Discord server of The Norwegian Student Society, and the server that verifies its Galtinn logins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.*",
    "asyncpg==0.32.*",
    "discord.py==2.7.*",
    "fastapi==0.162.*",
    "jinja2==3.1.*",
    "psutil==7.2.*",
    "pydantic==2.14.*",
    "pypandoc==1.17.*",
    "python-dotenv==1.2.*",
    "tzdata",  # This only needed if run on windows. I haven't set a version either to ensure it's up to date.
    "uvicorn==0.54.*",
]

[tool.black]
line-length = 120

[tool.isort]
atomic = true
profile = "black"
line_length = 120
force_single_line = true
src_paths = ["bot/src", "verification_server/src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# The rules ruff checked by default before it widened its defaults. Its import sorting rule would also conflict with isort
select = ["E", "F"]
