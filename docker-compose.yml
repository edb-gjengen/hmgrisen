services:
  hmgrisen_bot:
    container_name: hmgrisen_bot
    build: .
    network_mode: "host"
    environment:
      - TZ=Europe/Oslo
    # A named volume: docker would create ./logs as root, which the bot cannot write
    volumes:
      - logs:/app/bot/logs
    depends_on:
      - hmgrisen_verification_server
    env_file:
      - .env

  hmgrisen_verification_server:
    container_name: hmgrisen_verification_server
    build: .
    working_dir: /app/verification_server
    command: ["uvicorn", "src.server:app", "--host", "0.0.0.0", "--port", "8001"]
    network_mode: "host"
    env_file:
      - .env

volumes:
  logs:
